<script>
'use strict';
const $=id=>document.getElementById(id);const fmt=n=>String(n).padStart(2,'0');
let DRAWS=[],PRESETS={combos:[],groups:[]},PAYOUTS={combination:{}},group='КУ-КУ',selected=[],lastResult=null,showCount=20,historyMarks=new Set(),historyOrder='draw',syncMeta=null,autoRefreshBusy=false,savedAnyCombos=[],tableManualSelected=[],tableManualColors={},tablePaintColor='',tableActiveDrawIds=[],tableRecentWindow=0;
const AUTO_REFRESH_MS=10*1000;
const TICKET_PRICE=100;
const SAVED_ANY_KEY='comboKenoSavedAnyCombosV2';
const filter={mode:'last',one:'',date:'',fromDate:'',toDate:'',count:50,fromDraw:'',toDraw:''};

function parseDMY(s){const m=String(s||'').match(/^(\d{2})\.(\d{2})\.(\d{2,4})$/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return Date.UTC(y,+m[2]-1,+m[1]);}
function inputDateToUTC(s){if(!s)return 0;const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function drawColumn(d){
 const c=Number(d?.column);
 return Number.isInteger(c)&&c>=1&&c<=10?c:null;
}
function prizeForHits(selectedCount,h){return Number(PAYOUTS?.combination?.[String(selectedCount)]?.[String(h)]||0)}
function money(v){return v.toLocaleString('ru-RU')+' ₽'}
function comboKey(nums){return [...nums].sort((a,b)=>a-b).join('-')}
function loadSavedAnyCombos(){
  try{
    const raw=JSON.parse(localStorage.getItem(SAVED_ANY_KEY)||'[]');
    savedAnyCombos=(Array.isArray(raw)?raw:[]).map(item=>{
      const nums=(Array.isArray(item?.nums)?item.nums:[]).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=80);
      return nums.length?{key:comboKey(nums),nums:[...new Set(nums)].sort((a,b)=>a-b),createdAt:Number(item?.createdAt)||Date.now()}:null;
    }).filter(Boolean);
  }catch(e){savedAnyCombos=[]}
}
function persistSavedAnyCombos(){
  try{localStorage.setItem(SAVED_ANY_KEY,JSON.stringify(savedAnyCombos.map(item=>({nums:item.nums,createdAt:item.createdAt}))))}catch(e){}
}
function renderSavedCombos(){
  const box=$('savedCombosList');
  if(!box)return;
  if(!savedAnyCombos.length){box.innerHTML='<div class="savedEmpty">Пока ничего не сохранено.</div>';return}
  box.innerHTML=savedAnyCombos.map(item=>`<div class="savedItem"><button type="button" class="savedMain" data-saved-run="${item.key}"><div class="savedNums">${item.nums.map(fmt).join(' ')}</div><div class="savedMeta">Нажать, чтобы проверить по выбранным тиражам</div></button><button type="button" class="savedDel" data-saved-del="${item.key}">❌</button></div>`).join('');
  box.querySelectorAll('[data-saved-run]').forEach(b=>b.onclick=()=>runSavedCombo(b.dataset.savedRun));
  box.querySelectorAll('[data-saved-del]').forEach(b=>b.onclick=()=>deleteSavedCombo(b.dataset.savedDel));
}

function openSavedDrawer(){
  const d=$('savedDrawer');
  if(!d)return;
  renderSavedCombos();
  d.classList.remove('hidden');
  if($('savedDrawerBtn'))$('savedDrawerBtn').classList.add('on');
}
function closeSavedDrawer(){
  const d=$('savedDrawer');
  if(!d)return;
  d.classList.add('hidden');
  if($('savedDrawerBtn'))$('savedDrawerBtn').classList.remove('on');
}
function toggleSavedDrawer(){
  const d=$('savedDrawer');
  if(!d)return;
  if(d.classList.contains('hidden'))openSavedDrawer();else closeSavedDrawer();
}
function clearCurrentSelection(){selected=[];renderPick()}
function saveCurrentSelection(){
  if(!selected.length){alert('Сначала выберите хотя бы одно число');return}
  const nums=[...selected].sort((a,b)=>a-b);
  const key=comboKey(nums);
  if(savedAnyCombos.some(item=>item.key===key)){alert('Эта комба уже сохранена');return}
  savedAnyCombos.unshift({key,nums,createdAt:Date.now()});
  persistSavedAnyCombos();
  renderSavedCombos();
}
function deleteSavedCombo(key){
  savedAnyCombos=savedAnyCombos.filter(item=>item.key!==key);
  persistSavedAnyCombos();
  renderSavedCombos();
}
function runSavedCombo(key){
  const item=savedAnyCombos.find(x=>x.key===key);
  if(!item)return;
  selected=[...item.nums];
  renderPick();
  runCheck(item.nums,`⏰ ${item.nums.map(fmt).join(' ')}`);

function updateDbLine(){
  const last=DRAWS.at(-1);
  if(!last){$('dbline').textContent='База пуста';return}
  $('dbline').textContent=`База: ${DRAWS.length.toLocaleString('ru-RU')} · последний №${last.draw} · ${last.date} ${last.time}`;
  if($('tableDrawer') && !$('tableDrawer').classList.contains('hidden'))renderTableDrawer();
}
function refreshOpenHistory(){
  if(!lastResult)return;
  const nums=[...lastResult.nums],name=lastResult.name;
  const a=getFiltered();
  lastResult={nums,name,draws:a,st:stats(nums,a)};
  renderHistory();
}
async function fetchJSONLive(name){
  const sep=name.includes('?')?'&':'?';
  const r=await fetch(`${name}${sep}_live=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);
  const text=await r.text();
  if(/^\s*</.test(text))throw new Error(`${name}: получен HTML вместо JSON`);
  return JSON.parse(text);
}
async function autoRefreshLive(force=false){
  if(autoRefreshBusy||document.hidden)return;
  autoRefreshBusy=true;
  try{
    const s=await fetchJSONLive('combo-status-v1.json');
    const current=Number(DRAWS.at(-1)?.draw||0);
    const official=Number(s?.latestDraw||0);
    syncMeta=s;

    if(!force && official<=current)return;

    const d=await fetchJSONLive('combo-history-v1.json');
    if(!Array.isArray(d)||!d.length)throw new Error('combo-history-v1.json пуст');
    d.sort((a,b)=>a.draw-b.draw);

    const received=Number(d.at(-1)?.draw||0);
    if(official && received<official)throw new Error(`История ещё не догнала status: ${received}<${official}`);

    if(received>current || force){
      DRAWS=d;
      updateDbLine();
      renderFields('anyP');
      renderFields('ourP');
      refreshOpenHistory();
    }
  }catch(e){
    console.warn('COMBO LIVE AUTO',e);
  }finally{
    autoRefreshBusy=false;
  }
}
function startAutoRefresh(){
  window.setTimeout(()=>autoRefreshLive(false),1000);
  window.setInterval(()=>autoRefreshLive(false),AUTO_REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefreshLive(true)});
  window.addEventListener('focus',()=>autoRefreshLive(false));
  window.addEventListener('pageshow',()=>autoRefreshLive(false));
  window.addEventListener('online',()=>autoRefreshLive(true));
}

async function forceUpdate(){const b=$('refreshBtn');if(!b)return;b.disabled=true;b.textContent='↻ Обновляю…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})))}if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('combo-keno-shell')).map(k=>caches.delete(k)))}}catch(e){console.warn(e)}finally{const u=new URL(location.href);u.searchParams.set('_v',Date.now());location.replace(u.toString())}}
async function load(){
  try{
    const [d,p,s,pay]=await Promise.all([
      fetchJSONLive('combo-history-v1.json'),
      fetchJSONLive('combo-presets-v1.json'),
      fetchJSONLive('combo-status-v1.json').catch(()=>null),
      fetchJSONLive('keno-payouts-v1.json')
    ]);
    DRAWS=d.sort((a,b)=>a.draw-b.draw);PRESETS=p;PAYOUTS=pay;syncMeta=s;
    updateDbLine();
    renderGroups();renderCombos();renderPick();
    startAutoRefresh();
  }catch(e){
    $('dbline').textContent='Ошибка загрузки базы';
    console.error(e);
  }
}

<script id="comboAutoUpdate">
(()=>{
 let reloading=false;
 const check=async()=>{
  try{
   if(!('serviceWorker' in navigator))return;
   const reg=await navigator.serviceWorker.getRegistration();
   if(reg)await reg.update();
  }catch(e){console.warn('COMBO auto update',e)}
 };
 if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
   if(reloading)return;
   reloading=true;
   location.reload();
  });
  setInterval(check,600000);
  addEventListener('focus',check);
  addEventListener('pageshow',check);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  setTimeout(check,1500);
 }
})();
</script>
