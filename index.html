<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061321">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>COMBO KENO</title>
<style>
:root{--bg:#04111e;--p:#0c2135;--p2:#102a43;--line:#274863;--text:#f3f8fc;--muted:#9eb0c1;--green:#6fd33f;--green2:#2e8f2b;--gold:#ffbd23;--red:#ff453a;--blue:#35a9ff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at top,#0b2842 0,#04111e 38%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select{font:inherit}.app{max-width:650px;margin:auto;padding:10px 10px 82px}.top{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center}.logo{width:52px;height:52px;border-radius:15px;border:1px solid #3d6686}.title{font-weight:950;font-size:21px;letter-spacing:.3px}.dbline{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card{background:linear-gradient(180deg,rgba(15,39,62,.98),rgba(7,24,39,.98));border:1px solid var(--line);border-radius:15px;padding:11px;margin:9px 0;box-shadow:0 9px 28px rgba(0,0,0,.18)}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:9px 0 6px}.muted{font-size:12px;color:var(--muted)}.hidden{display:none!important}
button{border:1px solid #315677;border-radius:12px;background:#132e48;color:#fff;font-weight:850;padding:10px;cursor:pointer}.primary{background:linear-gradient(180deg,#58c62b,#319020);border-color:#66dd38}.ghost{background:#0a1c2d}.active{background:linear-gradient(180deg,#2c7d40,#1e5b32);border-color:#55c876}.big{width:100%;font-size:16px;padding:13px}.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;overflow:auto}.groups button{font-size:10.5px;padding:8px 3px;white-space:nowrap}.comboList{display:grid;gap:6px}.comboBtn{display:grid;grid-template-columns:75px 1fr auto;gap:6px;align-items:center;text-align:left}.comboBtn .cid{font-weight:950;color:var(--gold)}.comboBtn .nums{font-size:12px}.comboBtn .ncount{font-size:10px;color:var(--muted)}
.pickgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.pick{aspect-ratio:1/1;border-radius:50%;padding:0;font-size:12px;background:#0b1d2d}.pick.on{background:linear-gradient(180deg,#6fd33f,#2f9626);border-color:#8ff75f}.selectedbar{display:flex;gap:5px;flex-wrap:wrap;min-height:31px;margin-top:7px}.sel{padding:5px 7px;border-radius:8px;background:#26752d;border:1px solid #67c93f;font-weight:900;font-size:12px}
.acc{padding:0;overflow:hidden}.accHead{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px;cursor:pointer}.accHead b{font-size:15px}.accBody{padding:0 10px 10px;border-top:1px solid #23425d}.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.modegrid button{font-size:10.5px;padding:9px 4px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.fields label{font-size:11px;color:var(--muted)}.fields input{width:100%;margin-top:4px;background:#061421;color:#fff;border:1px solid #2e526d;border-radius:9px;padding:8px}.wide{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat{border:1px solid #294b66;background:#081827;border-radius:11px;padding:8px;text-align:center}.stat b{display:block;font-size:21px;color:var(--green)}.stat span{font-size:10px;color:var(--muted)}.stat.fire b{color:var(--gold)}
.resultTop{display:flex;gap:5px;flex-wrap:wrap}.resultTop .sel{font-size:14px}.historyTitle{font-weight:950;font-size:16px;margin:12px 0 7px}.hist{border:1px solid var(--line);border-radius:13px;overflow:hidden}.hrow{display:grid;grid-template-columns:28% 16% 56%;align-items:stretch;border-top:1px solid #203c54;min-height:70px}.hrow:first-child{border-top:0}.hrow.head{min-height:auto;background:#102a43;color:#bcd0e0;font-size:10px;font-weight:800}.hcell{padding:7px 5px;border-left:1px solid #203c54;min-width:0}.hcell:first-child{border-left:0}.hdraw{font-size:12px;font-weight:900}.hsub{font-size:11px;color:var(--gold);font-weight:800;margin-top:2px}.hdate{font-size:10px;color:#b4c3d0;margin-top:4px}.hitbox{display:flex;align-items:center;justify-content:center;min-height:54px;flex-direction:column;gap:4px}.hits{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:950}.hits.z{color:var(--red)}.hits.o{color:var(--green)}.hits.h{color:var(--gold)}.hits.fire{color:var(--gold);line-height:1}.flame{font-size:19px;margin-right:3px}.prize{font-size:10px;line-height:1.05;border:1px solid #7b5a17;background:#132233;color:var(--gold);border-radius:7px;padding:4px 5px;text-align:center;font-weight:900;white-space:nowrap}.drawnums{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;align-content:center;padding:6px 3px}.dn{text-align:center;font-size:10px;line-height:18px;border-radius:5px;font-variant-numeric:tabular-nums}.dn.hit{background:linear-gradient(180deg,#4a9e26,#236d22);color:#fff;font-weight:950}.more{width:100%;border:0;border-top:1px solid #294b66;border-radius:0;background:#0b2032;color:#bcd0e0}
.msg{font-size:12px;padding:8px;border:1px solid #294b66;border-radius:9px;color:#c7d7e6}.msg.err{border-color:#743c42;color:#ffb6b6}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(4,17,30,.97);border-top:1px solid #274863;padding:6px 7px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:20}.footin{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav{padding:7px 2px;background:transparent;border:0;color:#9db0c2;font-size:10px}.nav b{display:block;font-size:20px}.nav.on{color:#7be34c}.section{display:none}.section.on{display:block}
@media(max-width:380px){.app{padding-left:7px;padding-right:7px}.hrow{grid-template-columns:29% 17% 54%}.dn{font-size:9px}.hdraw{font-size:11px}.hsub{font-size:10px}.hdate{font-size:9px}.groups button{font-size:9.5px}.comboBtn{grid-template-columns:68px 1fr auto}.prize{font-size:9px;padding:3px 4px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><img class="logo" src="icon-192.png" alt=""><div><div class="title">COMBO KENO</div><div id="dbline" class="dbline">База загружается…</div></div></header>

<section id="our" class="section on">
 <div class="card"><h2>Наши комбы</h2><div class="muted">45 комбинаций · К16 и ТС7 считаются отдельно</div><div id="groups" class="groups" style="margin-top:8px"></div><div id="comboList" class="comboList" style="margin-top:8px"></div></div>
 <div id="ourChosen" class="card hidden"></div>
</section>

<section id="any" class="section">
 <div class="card"><h2>Любая комба</h2><div class="muted">Выберите от 1 до 10 чисел</div><div id="pickgrid" class="pickgrid" style="margin-top:9px"></div><div id="selectedbar" class="selectedbar"></div></div>
 <div id="anyParams"></div>
 <button id="checkAny" class="primary big">ПРОВЕРИТЬ</button>
</section>

<section id="history" class="section">
 <div id="historyBox" class="card"><h2>История</h2><div class="msg">Сначала проверьте нашу или любую комбинацию.</div></div>
</section>
</div>

<nav class="footer"><div class="footin">
<button class="nav on" data-sec="our"><b>★</b>Наши комбы</button>
<button class="nav" data-sec="any"><b>⊞</b>Любая комба</button>
<button class="nav" data-sec="history"><b>◷</b>История</button>
</div></nav>

<script>
'use strict';
const $=id=>document.getElementById(id);const fmt=n=>String(n).padStart(2,'0');
let DRAWS=[],PRESETS={combos:[],groups:[]},group='КУ-КУ',selected=[],lastResult=null,showCount=20;
const filter={mode:'last',one:'',date:'',fromDate:'',toDate:'',count:50,fromDraw:'',toDraw:''};
const FIRE_PRIZES={6:5000,7:15000,8:50000,9:150000,10:500000};

function parseDMY(s){const m=String(s||'').match(/^(\d{2})\.(\d{2})\.(\d{2,4})$/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return Date.UTC(y,+m[2]-1,+m[1]);}
function inputDateToUTC(s){if(!s)return 0;const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function drawColumn(d){const cnt=Array(10).fill(0);for(const n of d.balls)cnt[(n-1)%10]++;const mx=Math.max(...cnt), tied=new Set(cnt.map((c,i)=>c===mx?i+1:null).filter(Boolean));for(const n of d.balls){const c=((n-1)%10)+1;if(tied.has(c))return c}return 1}
function prizeForHits(h){return FIRE_PRIZES[h]||0}
function money(v){return v.toLocaleString('ru-RU')+' ₽'}
function getFiltered(){let a=DRAWS;if(filter.mode==='one'){const x=+filter.one;a=a.filter(d=>d.draw===x)}else if(filter.mode==='date'){const t=inputDateToUTC(filter.date);a=a.filter(d=>parseDMY(d.date)===t)}else if(filter.mode==='dates'){const f=inputDateToUTC(filter.fromDate),t=inputDateToUTC(filter.toDate);a=a.filter(d=>{const x=parseDMY(d.date);return (!f||x>=f)&&(!t||x<=t)})}else if(filter.mode==='last'){const n=Math.max(1,+filter.count||50);a=a.slice(-n)}else if(filter.mode==='range'){const f=+filter.fromDraw||-Infinity,t=+filter.toDraw||Infinity;a=a.filter(d=>d.draw>=f&&d.draw<=t)}return a}
function hitsFor(nums,d){let h=0;for(const n of nums)if(d.balls.includes(n))h++;return h}
function stats(nums,a){const hs=a.map(d=>hitsFor(nums,d)),sum=hs.reduce((x,y)=>x+y,0),best=hs.length?Math.max(...hs):0,avg=hs.length?sum/hs.length:0,withHit=hs.filter(x=>x>0).length;let cur=0;for(let i=hs.length-1;i>=0&&hs[i]>0;i--)cur++;let rec=0,run=0;for(const h of hs){if(h>0){run++;rec=Math.max(rec,run)}else run=0}return{sum,best,avg,pct:hs.length?withHit*100/hs.length:0,cur,rec}}
function modeLabel(){if(filter.mode==='one')return 'Тираж №'+filter.one;if(filter.mode==='date')return 'Дата '+(filter.date||'—');if(filter.mode==='dates')return 'Диапазон дат';if(filter.mode==='last')return 'Последние '+filter.count+' тиражей';if(filter.mode==='range')return 'Диапазон тиражей';return 'Вся база'}
function paramsHTML(prefix){return `<div class="card acc" id="${prefix}Acc"><div class="accHead" data-acc="${prefix}"><div><b>🎯 Параметры проверки</b><div class="muted" id="${prefix}ModeLabel">${modeLabel()}</div></div><div>▶</div></div><div class="accBody hidden" id="${prefix}Body"><div class="modegrid">${[['one','1 тираж'],['date','Дата'],['dates','Диапазон дат'],['last','Кол-во тиражей'],['range','Диапазон тир.'],['all','Вся база']].map(([m,t])=>`<button data-mode="${m}" data-prefix="${prefix}" class="${filter.mode===m?'active':''}">${t}</button>`).join('')}</div><div id="${prefix}Fields" class="fields"></div></div></div>`}
function renderFields(prefix){const box=$(prefix+'Fields');if(!box)return;let h='';if(filter.mode==='one')h=`<label class="wide">Номер тиража<input data-f="one" type="number" value="${filter.one}"></label>`;if(filter.mode==='date')h=`<label class="wide">Дата<input data-f="date" type="date" value="${filter.date}"></label>`;if(filter.mode==='dates')h=`<label>От<input data-f="fromDate" type="date" value="${filter.fromDate}"></label><label>До<input data-f="toDate" type="date" value="${filter.toDate}"></label>`;if(filter.mode==='last')h=`<label class="wide">Количество тиражей<input data-f="count" type="number" min="1" max="${DRAWS.length||31027}" value="${filter.count}"></label>`;if(filter.mode==='range')h=`<label>С №<input data-f="fromDraw" type="number" value="${filter.fromDraw}"></label><label>По №<input data-f="toDraw" type="number" value="${filter.toDraw}"></label>`;box.innerHTML=h;box.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{filter[el.dataset.f]=el.value;document.querySelectorAll('[id$="ModeLabel"]').forEach(x=>x.textContent=modeLabel())})}
function bindParams(root=document){root.querySelectorAll('[data-acc]').forEach(h=>h.onclick=()=>{const p=h.dataset.acc,b=$(p+'Body');b.classList.toggle('hidden');h.lastElementChild.textContent=b.classList.contains('hidden')?'▶':'▼'});root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{filter.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===filter.mode));document.querySelectorAll('[id$="ModeLabel"]').forEach(x=>x.textContent=modeLabel());renderFields(b.dataset.prefix)})}
function renderGroups(){$('groups').innerHTML=PRESETS.groups.map(g=>`<button data-group="${g}" class="${g===group?'active':''}">${g}</button>`).join('');$('groups').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;renderGroups();renderCombos()})}
function renderCombos(){const a=PRESETS.combos.filter(c=>c.group===group);$('comboList').innerHTML=a.map((c,i)=>`<button class="comboBtn" data-i="${i}"><span class="cid">${c.id}</span><span class="nums">${c.numbers.map(fmt).join(' ')}</span><span class="ncount">${c.numbers.length} ч.</span></button>`).join('');$('comboList').querySelectorAll('[data-i]').forEach((b)=>b.onclick=()=>chooseOur(a[+b.dataset.i]))}
function chooseOur(c){const box=$('ourChosen');box.classList.remove('hidden');box.innerHTML=`<h2>${c.id}</h2><div class="resultTop">${c.numbers.map(n=>`<span class="sel">${fmt(n)}</span>`).join('')}</div><div id="ourParams">${paramsHTML('ourP')}</div><button id="checkOur" class="primary big" style="margin-top:8px">ПРОВЕРИТЬ</button>`;bindParams(box);renderFields('ourP');$('checkOur').onclick=()=>runCheck(c.numbers,c.id);box.scrollIntoView({behavior:'smooth',block:'start'})}
function renderPick(){$('pickgrid').innerHTML=Array.from({length:80},(_,i)=>i+1).map(n=>`<button class="pick ${selected.includes(n)?'on':''}" data-n="${n}">${fmt(n)}</button>`).join('');$('pickgrid').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(selected.includes(n))selected=selected.filter(x=>x!==n);else if(selected.length<10)selected=[...selected,n].sort((a,b)=>a-b);renderPick()});$('selectedbar').innerHTML=selected.length?selected.map(n=>`<span class="sel">${fmt(n)}</span>`).join(''):'<span class="muted">Ничего не выбрано</span>'}
function hitCell(h){const prize=prizeForHits(h);if(prize){return `<div class="hitbox"><div class="hits fire"><span class="flame">🔥</span><span>${h}</span></div><div class="prize">Сумма<br>${money(prize)}</div></div>`}const cl=h===0?'z':h>=2?'h':'o';return `<div class="hitbox"><div class="hits ${cl}">${h}</div></div>`}
function histRow(d,nums){return `<div class="hrow"><div class="hcell"><div class="hdraw">${d.draw}</div><div class="hsub">Столб ${drawColumn(d)}</div><div class="hdate">${d.date} ${d.time}</div></div><div class="hcell">${hitCell(hitsFor(nums,d))}</div><div class="hcell drawnums">${d.balls.map(n=>`<span class="dn ${nums.includes(n)?'hit':''}">${fmt(n)}</span>`).join('')}</div></div>`}
function renderHistory(){if(!lastResult)return;const {nums,name,draws,st}=lastResult;const ordered=[...draws].sort((a,b)=>b.draw-a.draw),shown=ordered.slice(0,showCount);$('historyBox').innerHTML=`<h2>${name}</h2><div class="resultTop">${nums.map(n=>`<span class="sel">${fmt(n)}</span>`).join('')}</div><div class="muted" style="margin-top:6px">${modeLabel()} · ${draws.length} тиражей</div><div class="stats" style="margin-top:9px"><div class="stat"><b>${st.sum}</b><span>Σ попаданий</span></div><div class="stat"><b>${st.best}</b><span>Макс.</span></div><div class="stat"><b>${st.avg.toFixed(2)}</b><span>Среднее</span></div><div class="stat"><b>${st.pct.toFixed(0)}%</b><span>С попад.</span></div><div class="stat fire"><b>${st.cur}</b><span>🔥 текущая серия</span></div><div class="stat fire"><b>${st.rec}</b><span>🔥 рекорд серии</span></div></div><div class="historyTitle">КАК ШЛА КОМБИНАЦИЯ</div><div class="hist"><div class="hrow head"><div class="hcell">Тираж / Столб / Дата</div><div class="hcell">Попад.</div><div class="hcell">Числа тиража · 2×10</div></div>${shown.map(d=>histRow(d,nums)).join('')}${shown.length<ordered.length?'<button id="moreBtn" class="more">ПОКАЗАТЬ ЕЩЁ ▼</button>':''}</div>`;if($('moreBtn'))$('moreBtn').onclick=()=>{showCount+=20;renderHistory()}}
function runCheck(nums,name){if(!nums.length){alert('Выберите хотя бы одно число');return}const a=getFiltered();if(!a.length){alert('По выбранным параметрам тиражи не найдены');return}showCount=20;lastResult={nums:[...nums],name,draws:a,st:stats(nums,a)};renderHistory();switchSec('history')}
function switchSec(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('on',s.id===id));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.sec===id));window.scrollTo({top:0,behavior:'smooth'})}
async function load(){try{const [d,p,s]=await Promise.all([fetch('combo-history-v1.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('combo-presets-v1.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('combo-status-v1.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>null)]);DRAWS=d.sort((a,b)=>a.draw-b.draw);PRESETS=p;const last=DRAWS.at(-1);$('dbline').textContent=`База: ${DRAWS.length.toLocaleString('ru-RU')} · последний №${last.draw} · ${last.date} ${last.time}`;renderGroups();renderCombos();renderPick()}catch(e){$('dbline').textContent='Ошибка загрузки базы';console.error(e)}}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchSec(b.dataset.sec));$('anyParams').innerHTML=paramsHTML('anyP');bindParams(document);renderFields('anyP');$('checkAny').onclick=()=>runCheck(selected,'Любая комба');renderPick();load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
