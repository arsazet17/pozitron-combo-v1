name: Install COMBO merged fast patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'install-combo-merged-fast.cjs'
      - '.github/workflows/install-combo-merged-fast.yml'

permissions:
  contents: write

concurrency:
  group: install-combo-merged-fast
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply merged patch
        run: node install-combo-merged-fast.cjs

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html xray-ui-v1.js .github/workflows/update-combo-v1.yaml; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html xray-ui-v1.js .github/workflows/update-combo-v1.yaml
          git commit -m "COMBO: fast updates, XRAY sync, instant cached startup"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
