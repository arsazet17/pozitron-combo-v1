name: Apply K7 LAB v1.4 saved archive

on:
  push:
    paths:
      - '.github/workflows/apply-k7-lab-v14-saved.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply K7 LAB v1.4 saved archive
        run: python .github/scripts/apply-k7-v14-saved.py

      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k7-interval-builder.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "K7 LAB v1.4: saved archive and forward tracking"
          git push
