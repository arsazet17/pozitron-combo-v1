{
  "name": "COMBO · SEARCH JOURNAL",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "combo-history-v1.json",
        "build-combo-search-log.mjs",
        "combo-search-v1.js",
        ".github/workflows/combo-search-journal.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "combo-main-writer",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "${{ github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Reconcile current main, test, then publish",
          "run": "node .github/scripts/ci-publish.mjs journal"
        },
        {
          "name": "Preserve failure diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "combo-journal-diagnostics",
            "path": "data/xray-runtime.json\ndata/xray-runtime.guard.json",
            "retention-days": 7,
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
