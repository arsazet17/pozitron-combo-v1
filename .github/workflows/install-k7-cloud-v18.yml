name: Install K7 Cloud v1.8

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/patch-k7-cloud-v18.mjs

permissions:
  contents: write

concurrency:
  group: combo-app-writer
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/patch-k7-cloud-v18.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k7-interval-builder.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "K7 LAB v1.8: repository-backed saved archive"
          git pull --rebase origin main
          git push origin HEAD:main
