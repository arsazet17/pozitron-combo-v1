name: INSTALL · COMBO v4.1.24 TRANSITIONS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "install-combo-transitions-v4124.cjs"
      - ".github/workflows/install-combo-transitions-v4124.yml"
permissions:
  contents: write
concurrency:
  group: combo-v4124-transitions
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: node install-combo-transitions-v4124.cjs
      - name: Refresh build
        run: node refresh-combo-build.mjs
      - name: Check
        run: |
          node --check install-combo-transitions-v4124.cjs
          node --check combo-search-v1.js
          grep -q 'csTransitionsBtn' combo-search-v1.js
          grep -q 'transitionSetForDraw' combo-search-v1.js
          grep -q '⬆️ Возрастание</button><button id="csTransitionsBtn"' combo-search-v1.js
          grep -q '"version": "4.1.24"' app-version.json
          grep -q 'combo-keno-shell-' sw.js
      - name: Commit after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combo-search-v1.js app-version.json index.html manifest.webmanifest sw.js install-combo-transitions-v4124.cjs .github/workflows/install-combo-transitions-v4124.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "COMBO v4.1.24 · transitions toggle"
          git pull --rebase origin main
          git push origin HEAD:main
