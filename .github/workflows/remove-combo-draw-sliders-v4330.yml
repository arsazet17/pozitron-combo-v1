name: COMBO · ANDROID INPUT FIX v4.3.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-combo-draw-sliders-v4330.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix Android manual counters and remove remaining sliders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------- combo-search-v1.js ----------------
          p = Path('combo-search-v1.js')
          s = p.read_text(encoding='utf-8')

          def req(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'PATCH FAILED combo-search: {label}')
              s = s.replace(old, new, 1)

          req("const EXT_VERSION='v4.3.30';", "const EXT_VERSION='v4.3.31';", 'version')

          req(
              '<input id="csWindowValue" class="csWheelValue" type="number" inputmode="numeric" pattern="[0-9]*" min="1" value="10" aria-label="Введите количество тиражей">',
              '<input id="csWindowValue" class="csWheelValue" type="tel" inputmode="numeric" pattern="[0-9]*" value="10" aria-label="Введите количество тиражей">',
              'main input type'
          )
          req(
              '<input id="csDrawValue" class="csWheelValue" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="${Math.max(1,archive.length)}" value="${count}" aria-label="Введите любое количество тиражей">',
              '<input id="csDrawValue" class="csWheelValue" type="tel" inputmode="numeric" pattern="[0-9]*" value="${count}" aria-label="Введите любое количество тиражей">',
              'detail input type'
          )

          req(
              "    if(windowInput){\n      windowInput.onfocus=()=>windowInput.select();\n      windowInput.onchange=()=>chooseWindow(windowInput.value,false);\n      windowInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();chooseWindow(windowInput.value,false);windowInput.blur()}};\n    }",
              "    if(windowInput){\n      windowInput.onfocus=()=>{windowInput.dataset.prev=windowInput.value;windowInput.value=''};\n      windowInput.oninput=()=>{windowInput.value=String(windowInput.value||'').replace(/\\D/g,'').slice(0,6)};\n      windowInput.onblur=()=>{if(!windowInput.value)windowInput.value=windowInput.dataset.prev||String(state.window);else chooseWindow(windowInput.value,false)};\n      windowInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();windowInput.blur()}};\n    }",
              'main focus handlers'
          )

          req(
              "      if(valueInput){\n        valueInput.onfocus=()=>valueInput.select();\n        valueInput.onchange=()=>setCount(valueInput.value);\n        valueInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();setCount(valueInput.value)}};\n      }",
              "      if(valueInput){\n        valueInput.onfocus=()=>{valueInput.dataset.prev=valueInput.value;valueInput.value=''};\n        valueInput.oninput=()=>{valueInput.value=String(valueInput.value||'').replace(/\\D/g,'').slice(0,6)};\n        valueInput.onblur=()=>{if(!valueInput.value)valueInput.value=valueInput.dataset.prev||String(count);else setCount(valueInput.value)};\n        valueInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();valueInput.blur()}};\n      }",
              'detail focus handlers'
          )

          if '.select()' in s:
              raise SystemExit('PATCH FAILED combo-search: forced text selection still present')
          if 'type="range"' in s:
              raise SystemExit('PATCH FAILED combo-search: slider still present')

          p.write_text(s, encoding='utf-8')

          # ---------------- combo-fresh-split-v1.js ----------------
          p = Path('combo-fresh-split-v1.js')
          f = p.read_text(encoding='utf-8')

          def freq(old, new, label):
              global f
              if old not in f:
                  raise SystemExit(f'PATCH FAILED fresh-split: {label}')
              f = f.replace(old, new, 1)

          # This module was reading textContent from an input, which always fell back to 10.
          freq("function windowNow(){return positive(q('csWindowValue')?.textContent||10,10,Math.max(1,archive().length))}",
               "function windowNow(){return positive(q('csWindowValue')?.value||10,10,Math.max(1,archive().length))}",
               'window input value')

          freq(
              '<input id="cfsLimit" class="cfsInput" type="number" min="1" inputmode="numeric" value="${DEFAULT_LIMIT}">',
              '<input id="cfsLimit" class="cfsInput" type="tel" inputmode="numeric" pattern="[0-9]*" value="${DEFAULT_LIMIT}">',
              'limit input type'
          )
          freq(
              '<input id="cfsFresh" class="cfsInput" type="number" min="1" inputmode="numeric" value="${DEFAULT_FRESH}">',
              '<input id="cfsFresh" class="cfsInput" type="tel" inputmode="numeric" pattern="[0-9]*" value="${DEFAULT_FRESH}">',
              'fresh input type'
          )
          freq(
              "    for(const id of ['cfsLimit','cfsFresh']){const el=q(id);el.onfocus=()=>el.select();el.onchange=()=>{q('csResults')?.classList.add('hidden')}}",
              "    for(const id of ['cfsLimit','cfsFresh']){const el=q(id),fallback=id==='cfsLimit'?String(DEFAULT_LIMIT):String(DEFAULT_FRESH);el.onfocus=()=>{el.dataset.prev=el.value;el.value=''};el.oninput=()=>{el.value=String(el.value||'').replace(/\\D/g,'').slice(0,6)};el.onblur=()=>{if(!el.value)el.value=el.dataset.prev||fallback;q('csResults')?.classList.add('hidden')};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}}}",
              'fresh controls focus handlers'
          )

          # The fresh-detail renderer still had an old range slider. Remove it too.
          freq(
              '<input id="csDrawValue" class="csWheelValue" type="number" inputmode="numeric" min="1" max="${a.length}" value="${count}">',
              '<input id="csDrawValue" class="csWheelValue" type="tel" inputmode="numeric" pattern="[0-9]*" value="${count}">',
              'fresh detail input type'
          )
          freq(
              '</div></div><input id="csDrawRange" class="csRange csDetailRange" type="range" min="1" max="${a.length}" value="${count}"></div><div class="hist">',
              '</div></div></div><div class="hist">',
              'fresh detail slider markup'
          )
          freq(
              "q('csDrawMinus').onclick=()=>set(count-1);q('csDrawPlus').onclick=()=>set(count+1);q('csDrawMax').onclick=()=>set(a.length);q('csDrawValue').onchange=e=>set(e.target.value);q('csDrawValue').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();set(e.target.value)}};q('csDrawRange').oninput=e=>{q('csDrawValue').value=e.target.value};q('csDrawRange').onchange=e=>set(e.target.value);",
              "q('csDrawMinus').onclick=()=>set(count-1);q('csDrawPlus').onclick=()=>set(count+1);q('csDrawMax').onclick=()=>set(a.length);const valueInput=q('csDrawValue');valueInput.onfocus=()=>{valueInput.dataset.prev=valueInput.value;valueInput.value=''};valueInput.oninput=()=>{valueInput.value=String(valueInput.value||'').replace(/\\D/g,'').slice(0,6)};valueInput.onblur=()=>{if(!valueInput.value)valueInput.value=valueInput.dataset.prev||String(count);else set(valueInput.value)};valueInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();valueInput.blur()}};",
              'fresh detail handlers'
          )

          if '.select()' in f:
              raise SystemExit('PATCH FAILED fresh-split: forced text selection still present')
          if 'type="range"' in f or 'csDrawRange' in f:
              raise SystemExit('PATCH FAILED fresh-split: slider still present')

          p.write_text(f, encoding='utf-8')
          PY

          node --check combo-search-v1.js
          node --check combo-fresh-split-v1.js
          grep -q "EXT_VERSION='v4.3.31'" combo-search-v1.js
          grep -q 'id="csWindowValue".*type="tel"' combo-search-v1.js
          grep -q 'id="cfsFresh".*type="tel"' combo-fresh-split-v1.js
          ! grep -q '\.select()' combo-search-v1.js
          ! grep -q '\.select()' combo-fresh-split-v1.js
          ! grep -q 'type="range"' combo-search-v1.js
          ! grep -q 'type="range"' combo-fresh-split-v1.js

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- combo-search-v1.js combo-fresh-split-v1.js; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combo-search-v1.js combo-fresh-split-v1.js
          git commit -m 'COMBO: fix Android numeric entry freeze'
          git push origin HEAD:main
