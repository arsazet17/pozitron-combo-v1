{
  "name": "COMBO · AUTO APP BUILD",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "index.html",
        "app-version.json",
        "manifest.webmanifest",
        "sw.js",
        "combo-search-v1.js",
        "combo-presets-v1.json",
        "keno-payouts-v1.json",
        "refresh-combo-build.mjs",
        "xray-engine-v1.js",
        "xray-structure-engine-v4.mjs",
        "xray-ui-v1.js",
        "xray-analog-columns-v1.js",
        "xray-v1.css",
        "icon-192.png",
        "icon-512.png",
        ".github/workflows/combo-auto-app-build.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "combo-main-writer",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "${{ github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Reconcile current main, test, then publish",
          "run": "node .github/scripts/ci-publish.mjs app"
        },
        {
          "name": "Preserve failure diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "combo-app-diagnostics",
            "path": "data/xray-runtime.json\ndata/xray-runtime.guard.json",
            "retention-days": 7,
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
