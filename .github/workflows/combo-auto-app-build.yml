{
  "name": "COMBO · AUTO APP BUILD",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "index.html",
        "app-version.json",
        "manifest.webmanifest",
        "sw.js",
        "combo-search-v1.js",
        "combo-fresh-split-v1.js",
        "combo-max-details-v1.js",
        "combo-table-lock-v1.js",
        "combo-presets-v1.json",
        "keno-payouts-v1.json",
        "refresh-combo-build.mjs",
        "self-test-workflows.mjs",
        "icon-192.png",
        "icon-512.png",
        ".github/workflows/combo-auto-app-build.yml",
        ".github/workflows/install-*.yml",
        "k7-interval-builder.html"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "combo-app-writer",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "${{ github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Reconcile current main, test, then publish",
          "run": "node .github/scripts/ci-publish.mjs app"
        }
      ]
    }
  }
}
