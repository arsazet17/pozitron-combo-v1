name: INSTALL · COMBO v4.1.31 INPUT FINAL FIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "install-combo-input-final-v4131.cjs"
      - ".github/workflows/install-combo-input-final-v4131.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: node install-combo-input-final-v4131.cjs

      - name: Validate before build
        run: |
          node --check combo-search-v1.js
          grep -Fq 'id="csDrawCount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"' combo-search-v1.js
          ! grep -Fq 'input.select()' combo-search-v1.js
          ! grep -Fq 'setSelectionRange' combo-search-v1.js
          ! grep -Fq 'input.focus({preventScroll:true})' combo-search-v1.js
          grep -Fq "input.onchange=apply;" combo-search-v1.js
          grep -Fq "function switchSec(id){try{document.activeElement?.blur()}" index.html
          grep -Fq "document.activeElement?.blur()" combo-search-v1.js
          grep -Fq "💰 Выигрышных:" combo-search-v1.js
          grep -Fq "🔥 Сумма выигрышей:" combo-search-v1.js

      - name: Refresh build
        run: node refresh-combo-build.mjs

      - name: Validate version
        run: |
          node -e "const v=JSON.parse(require('fs').readFileSync('app-version.json','utf8'));if(v.version!=='4.1.31')process.exit(1)"
          node --check combo-search-v1.js

      - name: Commit after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combo-search-v1.js index.html app-version.json manifest.webmanifest sw.js install-combo-input-final-v4131.cjs .github/workflows/install-combo-input-final-v4131.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "COMBO v4.1.31 · clean mobile input and blur navigation"
          git pull --rebase origin main
          git push origin HEAD:main
