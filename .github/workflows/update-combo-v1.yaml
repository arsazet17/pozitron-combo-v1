{
  "name": "COMBO v1 · Stoloto AUTO",
  "on": {
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
      }
    ],
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "stoloto-combo-update-v1.mjs",
        ".github/scripts/combo-data-update.mjs",
        ".github/workflows/update-combo-v1.yaml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "combo-data-writer",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "${{ github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install pinned official-source browser client",
          "run": "npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.2"
        },
        {
          "name": "Install browser",
          "run": "npx playwright install --with-deps chromium"
        },
        {
          "name": "Reconcile current main, test, then publish",
          "run": "node .github/scripts/ci-publish.mjs data",
          "env": {
            "STOLOTO_EMAIL": "${{ secrets.STOLOTO_EMAIL }}",
            "STOLOTO_PASSWORD": "${{ secrets.STOLOTO_PASSWORD }}"
          }
        },
        {
          "name": "Preserve failure diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "combo-data-diagnostics",
            "path": "data/xray-runtime.json\ndata/xray-runtime.guard.json",
            "retention-days": 7,
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
