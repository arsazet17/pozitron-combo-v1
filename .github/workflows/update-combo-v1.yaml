name: COMBO v1 · Stoloto AUTO

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-combo-v1
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Freeze target draw for this run
        env:
          COMBO_PUBLICATION_GRACE_MINUTES: "7"
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta

          S = [
            '00:02','00:17','00:32','01:02','01:17','01:32','02:02','02:17','02:32','03:02','03:32',
            '04:02','04:17','04:32','05:02','05:17','05:32','06:02','06:17','06:32','07:02','07:32',
            '08:02','08:17','08:32','09:02','09:17','09:32','10:02','10:17','10:32','11:02','11:32',
            '12:02','12:17','12:32','13:02','13:17','13:32','14:02','14:17','14:32','15:02','15:32',
            '16:02','16:17','16:32','17:02','17:17','17:32','18:02','18:17','18:32','19:02','19:32',
            '20:02','20:17','20:32','21:02','21:17','21:32','22:02','22:17','22:32','23:02','23:32'
          ]

          grace = int(os.environ["COMBO_PUBLICATION_GRACE_MINUTES"])
          now = datetime.now(timezone.utc) + timedelta(hours=3)
          cutoff = now - timedelta(minutes=grace)
          due = [t for t in S if t <= cutoff.strftime('%H:%M')]

          if due:
              due_date = cutoff.strftime('%d.%m.%y')
              due_time = due[-1]
          else:
              previous = cutoff - timedelta(days=1)
              due_date = previous.strftime('%d.%m.%y')
              due_time = S[-1]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"COMBO_DUE_DATE={due_date}\n")
              f.write(f"COMBO_DUE_TIME={due_time}\n")

          print(f"Frozen COMBO target: {due_date} {due_time}; run={now:%d.%m.%y %H:%M:%S} MSK; grace={grace}m")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.2-chromium

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Read Stoloto until frozen due draw is caught
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u
          success=0

          for attempt in 1 2 3 4 5 6; do
            echo "COMBO Stoloto attempt $attempt/6"

            if node stoloto-combo-update-v1.mjs; then
              if python3 - <<'PY'
          import json, os, sys
          from datetime import datetime

          S = [
            '00:02','00:17','00:32','01:02','01:17','01:32','02:02','02:17','02:32','03:02','03:32',
            '04:02','04:17','04:32','05:02','05:17','05:32','06:02','06:17','06:32','07:02','07:32',
            '08:02','08:17','08:32','09:02','09:17','09:32','10:02','10:17','10:32','11:02','11:32',
            '12:02','12:17','12:32','13:02','13:17','13:32','14:02','14:17','14:32','15:02','15:32',
            '16:02','16:17','16:32','17:02','17:17','17:32','18:02','18:17','18:32','19:02','19:32',
            '20:02','20:17','20:32','21:02','21:17','21:32','22:02','22:17','22:32','23:02','23:32'
          ]

          due_date = os.environ["COMBO_DUE_DATE"]
          due_time = os.environ["COMBO_DUE_TIME"]

          try:
              status = json.load(open("combo-status-v1.json", encoding="utf-8"))
              x = status.get("latestOfficial") or {}
          except Exception as exc:
              print("status read failed:", exc)
              sys.exit(1)

          def key(ds, tm):
              d = datetime.strptime(ds, "%d.%m.%y")
              return (d.toordinal(), S.index(tm) if tm in S else -1)

          try:
              ok = key(str(x.get("date")), str(x.get("time"))) >= key(due_date, due_time)
          except Exception:
              ok = False

          print("frozen_due=", due_date, due_time, "latest=", x.get("date"), x.get("time"), "draw=", x.get("draw"), "caught=", ok)
          sys.exit(0 if ok else 1)
          PY
              then
                echo "COMBO is caught up to the frozen target."
                success=1
                break
              fi
            else
              echo "Reader failed; retry is allowed."
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Retry in 25 sec..."
              sleep 25
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::COMBO could not catch the frozen due draw after 6 attempts."
            exit 1
          fi

      - name: Commit verified live data
        shell: bash
        run: |
          if git diff --quiet -- combo-history-v1.json combo-status-v1.json; then
            echo "No verified changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combo-history-v1.json combo-status-v1.json
          git commit -m "COMBO v1 · Stoloto frozen-target auto"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
