name: APPLY · COMBO TABLE LOCK v4.3.17

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_COMBO_LOCK_V4317.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: combo-app-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply polished table lock
        run: python APPLY_COMBO_LOCK_V4317.py

      - name: Validate lock module
        run: node --check combo-table-lock-v1.js

      - name: Rebuild app version and cache
        run: node refresh-combo-build.mjs

      - name: Smoke check
        run: |
          grep -q 'id="tableLockBtn"' index.html
          grep -q 'combo-table-lock-v1.js?v=' index.html
          grep -q 'combo-table-lock-v1.js' sw.js
          grep -q 'combo-table-lock-v1.js' .github/workflows/combo-auto-app-build.yml

      - name: Remove one-time patch files
        run: rm -f APPLY_COMBO_LOCK_V4317.py .github/workflows/apply-combo-lock-v4317.yml

      - name: Commit polished lock update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Add polished table lock for pinned colors'
          git push origin HEAD:main
