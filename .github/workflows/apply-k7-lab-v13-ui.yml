name: Apply K7 LAB v1.3 UI

on:
  push:
    paths:
      - '.github/workflows/apply-k7-lab-v13-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make K7 check clear
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('k7-interval-builder.html')
          s = p.read_text(encoding='utf-8')

          if 'LAB v1.2' not in s:
              raise SystemExit('Expected LAB v1.2 not found')
          s = s.replace('LAB v1.2', 'LAB v1.3', 1)

          s = s.replace(
              '<div class="muted">Ничего автоматически не сохраняется в COMBO. Можно только скопировать комбинацию.</div>',
              '<div class="muted">Копировать ничего не нужно. Нажмите <b>«ПРОВЕРИТЬ ЭТУ K7»</b> — ниже автоматически откроется её история 7/7.</div>',
              1,
          )

          old_card = '''<div class="card">\n  <b>🧪 Проверить свою K7</b>\n  <div class="muted">Показываются все полные 7/7 в выбранном окне: № тиража, дата, время, столб, интервал до следующего повторения и расширение общими числами.</div>\n  <div class="k7input" style="margin-top:8px"><input id="k7" placeholder="05 16 20 28 48 65 80"><button id="checkK7" class="gold">ПРОВЕРИТЬ</button></div>\n  <div id="occ" class="occ"></div>\n </div>'''
          new_card = '''<div class="card checkCard" id="checkCard">\n  <b>🔎 История K7 — что реально совпало</b>\n  <div class="muted">Для готовой K7 просто нажмите выше <b>«ПРОВЕРИТЬ ЭТУ K7»</b> — числа подставятся сами. Для своей K7 введите ровно 7 чисел и нажмите «ПРОВЕРИТЬ».</div>\n  <div id="selectedK7" class="selectedK7"></div>\n  <div class="k7input" style="margin-top:8px"><input id="k7" placeholder="Например: 05 16 20 28 48 65 80"><button id="checkK7" class="gold">🔎 ПРОВЕРИТЬ</button></div>\n  <div id="occ" class="occ"><div class="muted">Результат появится здесь: 7/7, № тиража, дата, время, столб, интервал и дополнительные совпавшие числа.</div></div>\n </div>'''
          if old_card not in s:
              raise SystemExit('Old K7 check card not found')
          s = s.replace(old_card, new_card, 1)

          css = '''\n.checkCard{scroll-margin-top:12px}.selectedK7{display:none;margin:9px 0;padding:9px;border:1px solid #4f7da0;border-radius:10px;background:#0a2135}.selectedK7.on{display:block}.selectedK7 b{display:block;margin-bottom:5px}.occSummary{padding:10px;border:1px solid #2c5675;border-radius:11px;background:#0b2032;font-size:12px;line-height:1.4}.occCard{border:1px solid #294b66;background:#081827;border-radius:12px;padding:10px}.occHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.occDraw{font-weight:950;font-size:16px}.occWhen{color:#b8c9d8;font-size:11px;line-height:1.35;margin-top:2px}.occGap{color:var(--gold);font-weight:950;text-align:right;font-size:12px;white-space:nowrap}.matchLine{margin-top:8px;font-size:11px;color:#cfe0ed}.ballRow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.ball{min-width:29px;text-align:center;padding:4px 5px;border-radius:7px;background:#0d2538;border:1px solid #294b66;color:#bcd0df;font-size:11px;font-weight:800}.ball.k7{background:linear-gradient(180deg,#4a9e26,#236d22);border-color:#7ade5a;color:#fff}.ball.extra{background:linear-gradient(180deg,#a37b11,#6b4e08);border-color:#e2bd42;color:#fff}.expandBox{margin-top:8px;padding:7px 8px;border-radius:9px;background:#0a1c2d;border:1px solid #294b66;font-size:11px;line-height:1.45;color:#c7d8e5}.expandBox strong{color:var(--gold)}\n'''
          s = s.replace('</style>', css + '</style>', 1)

          new_render = r'''function renderCombos(combos){
 const by=Object.fromEntries(STATS.map(s=>[s.n,s]));
 $('combos').innerHTML=combos.map((c,i)=>{
   const details=c.nums.map(n=>`${fmt(n)}: инт${by[n].cur}/С${by[n].strictHits}/М${by[n].softHits}/F${(by[n].freq*100).toFixed(0)}%`).join(' · ');
   const full7=CURRENT_DRAWS.filter(d=>c.nums.every(n=>(d.balls||[]).map(Number).includes(n))).length;
   return `<div class="combo"><div class="comboTop"><div><b>K7-${i+1}</b><div class="badge">рейтинг ${c.avgScore.toFixed(1)} · пары ${(c.pairPct*100).toFixed(1)}% · столбов ${c.cols}/7 · полных 7/7 в окне: <b>${full7}</b></div></div></div><div class="nums" style="margin-top:7px">${c.nums.map(n=>`<span class="n">${fmt(n)}</span>`).join('')}</div><div class="detail">${details}</div><div class="comboBtns"><button data-check="${c.key}" class="gold">🔎 ПРОВЕРИТЬ ЭТУ K7</button></div></div>`
 }).join('');
 document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
   const nums=b.dataset.check.split('-').map(Number);
   $('k7').value=nums.map(fmt).join(' ');
   checkK7(nums);
   $('checkCard').scrollIntoView({behavior:'smooth',block:'start'});
 });
}'''
          s, n = re.subn(r'function renderCombos\(combos\)\{.*?\n\}\n\nfunction build\(\)', new_render + '\n\nfunction build()', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderCombos replacement count={n}')

          new_check = r'''function ballsHTML(d,nums,extraNums=[]){
 const k7=new Set(nums),extra=new Set(extraNums),balls=(d.balls||[]).map(Number);
 return `<div class="ballRow">${balls.map(n=>`<span class="ball ${k7.has(n)?'k7':extra.has(n)?'extra':''}">${fmt(n)}</span>`).join('')}</div>`;
}

function checkK7(nums){
 const draws=CURRENT_DRAWS.length?CURRENT_DRAWS:DRAWS;
 const setNums=new Set(nums);
 const selected=$('selectedK7');
 selected.classList.add('on');
 selected.innerHTML=`<b>Проверяем K7:</b><div class="nums">${nums.map(n=>`<span class="n">${fmt(n)}</span>`).join('')}</div>`;
 const hits=draws.filter(d=>nums.every(n=>(d.balls||[]).map(Number).includes(n)));
 if(!hits.length){
   $('occ').innerHTML=`<div class="occSummary"><b>Полных 7/7: 0</b> из ${draws.length} тиражей.<br><span class="muted">Все семь выбранных чисел одновременно в одном тираже в этом окне не встречались.</span></div>`;
   return;
 }
 const cards=hits.map((d,i)=>{
   let gapText='Первый полный выход',compare='Первое появление этой K7 в выбранном окне.',extraNums=[];
   if(i>0){
     const prev=hits[i-1];
     const idxA=draws.findIndex(x=>Number(x.draw)===Number(prev.draw)),idxB=draws.findIndex(x=>Number(x.draw)===Number(d.draw));
     const gap=idxB-idxA;
     const prevSet=new Set((prev.balls||[]).map(Number));
     const common=uniq((d.balls||[]).map(Number).filter(n=>prevSet.has(n)));
     extraNums=common.filter(n=>!setNums.has(n)).sort((a,b)=>a-b);
     gapText=`Повтор через ${gap} тир.`;
     compare=extraNums.length
       ? `Между №${prev.draw} и №${d.draw} совпало <strong>${common.length} из 20</strong>: сама K7 = <strong>7/7</strong> + расширение <strong>+${extraNums.length}</strong>: ${extraNums.map(fmt).join(' ')}`
       : `Между №${prev.draw} и №${d.draw}: сама K7 совпала <strong>7/7</strong>, дополнительных общих чисел нет — простой повтор.`;
   }
   return `<div class="occCard">
     <div class="occHead"><div><div class="occDraw">№${d.draw}</div><div class="occWhen">${d.date} · <b>${d.time}</b> · <b>столб ${drawCol(d)}</b></div></div><div class="occGap">${gapText}</div></div>
     <div class="matchLine"><b>Совпали 7/7:</b></div><div class="ballRow">${nums.map(n=>`<span class="ball k7">${fmt(n)}</span>`).join('')}</div>
     <div class="matchLine"><b>Все 20 чисел тиража:</b> зелёные = K7${extraNums.length?', жёлтые = дополнительное расширение':''}</div>${ballsHTML(d,nums,extraNums)}
     <div class="expandBox">${compare}</div>
   </div>`;
 }).join('');
 $('occ').innerHTML=`<div class="occSummary"><b>Найдено полных 7/7: ${hits.length}</b> из ${draws.length} тиражей.<br><span class="muted">Ниже по каждому выходу видно: какие 7 чисел совпали, все 20 чисел тиража, время, столб и расширение относительно предыдущего полного выхода.</span></div>${cards}`;
}'''
          s, n = re.subn(r'function checkK7\(nums\)\{.*?\n\}\n\nasync function load', new_check + '\n\nasync function load', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'checkK7 replacement count={n}')

          if 'КОПИРОВАТЬ K7' in s:
              raise SystemExit('Old COPY K7 button still present')
          if 'ПРОВЕРИТЬ ЭТУ K7' not in s or 'Найдено полных 7/7' not in s:
              raise SystemExit('New UI markers missing')

          p.write_text(s, encoding='utf-8')
          print('K7 LAB v1.3 UI patch OK')
          PY

      - name: Commit page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k7-interval-builder.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "K7 LAB v1.3: clear 7/7 check details"
          git push
