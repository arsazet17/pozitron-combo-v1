name: Apply K7 LAB v1.3 UI

on:
  push:
    paths:
      - '.github/workflows/apply-k7-lab-v13-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch K7 page
        run: python .github/scripts/apply-k7-v13.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k7-interval-builder.html
          git diff --cached --quiet && exit 0
          git commit -m "K7 LAB v1.3: clear 7/7 check details"
          git push
