{
  "name": "COMBO · integration checks",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        "self-test-*.mjs",
        "keno-payouts-v1.json",
        "combo-history-v1.json",
        "index.html",
        "sw.js",
        "manifest.webmanifest",
        "app-version.json",
        "refresh-combo-build.mjs",
        ".github/workflows/**",
        ".github/scripts/**",
        "**/*.js",
        "**/*.mjs",
        "**/*.cjs"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "self-test-*.mjs",
        "keno-payouts-v1.json",
        "combo-history-v1.json",
        "index.html",
        "sw.js",
        "manifest.webmanifest",
        "app-version.json",
        "refresh-combo-build.mjs",
        ".github/workflows/**",
        ".github/scripts/**",
        "**/*.js",
        "**/*.mjs",
        "**/*.cjs"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "checks": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Syntax, workflow and data-refresh tests",
          "run": "node .github/scripts/check-stage1.mjs"
        },
        {
          "name": "Install pinned browser for live UI regression",
          "run": "npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.2\nnpx playwright install --with-deps chromium"
        },
        {
          "name": "Real browser: automatic data updates preserve matrix state",
          "run": "node self-test-combo-live-browser.mjs"
        }
      ]
    }
  }
}
