name: Apply Android input focus fix

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply-input-focus-fix.py"
      - ".github/workflows/apply-input-focus-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused input fix
        run: python .github/scripts/apply-input-focus-fix.py
      - name: Verify fix
        run: |
          grep -F "const active=document.activeElement;" index.html
          grep -F "box.contains(active)" index.html
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u index.html.patch 2>/dev/null || true
          git commit -m "Fix Android draw-count input focus"
          git push
