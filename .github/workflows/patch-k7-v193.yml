name: Patch K7 LAB v1.9.3

on:
  push:
    paths:
      - '.github/workflows/patch-k7-v193.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch K7 loader cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('k7-interval-builder.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('k7-supabase-cloud-v19.js?v=3','k7-supabase-cloud-v19.js?v=4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- k7-interval-builder.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k7-interval-builder.html
          git commit -m 'K7 LAB v1.9.3: bust Supabase client cache'
          git push origin HEAD:main
